[project]
name = "personal-finance-dashboard"
version = "0.1.0"
description = "Personal finance dashboard for tracking bank accounts, investments and expenses"
authors = [
    {name = "Alex Carnero",email = "alexandrecarnerop@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "cryptography (>=50.0.0,<51.0.0)",
    "sqlalchemy (>=2.0.52,<3.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
